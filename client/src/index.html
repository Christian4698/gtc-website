         ANALYTICS - GTC TRACKING

    <!-- Google Analytics 4 (loads only when ID is configured) -->
    <script>
      (function() {
        var id = window.GTC_ANALYTICS.GA4_MEASUREMENT_ID;
        if (!id || id === 'G-XXXXXXXXXX') return;
        var s = document.createElement('script');
        s.async = true;
        s.src = 'https://www.googletagmanager/*  */.com/gtag/js?id=' + id;
        document.head.appendChild(s);
        window.dataLayer = window.dataLayer || [];
        window.gtag = function() { window.dataLayer.push(arguments); };
        window.gtag('js', new Date());
        // send_page_view: false because the React app fires it manually on route changes (SPA)
        window.gtag('config', id, { send_page_view: false });
      })();
    </script>

    <!-- Meta Pixel (loads only when ID is configured) -->
    <script>
      (function() {
        var id = window.GTC_ANALYTICS.META_PIXEL_ID;

        n.queue=[];t=b.createElement(e);t.async=!0;
        t.src=v;s=b.getElementsByTagName(e)[0];
        s.parentNode.insertBefore(t,s)}(window, document,'script',
        'https://connect.facebook.net/en_US/fbevents.js');
        window.fbq('init', id);
        window.fbq('track', 'PageView');

    </script>
